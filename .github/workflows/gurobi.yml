name: Gurobi EVRP CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------
  # 1. Gurobi / WLS / MILP smoke tests
  # ---------------------------------------------------------
  gurobi-test:

    name: Gurobi Tests

    runs-on: ubuntu-24.04

    env:
      GRB_WLSACCESSID: ${{ secrets.GRB_WLSACCESSID }}
      GRB_WLSSECRET: ${{ secrets.GRB_WLSSECRET }}
      GRB_LICENSEID: ${{ secrets.GRB_LICENSEID }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------------------------
      # Check that all WLS credentials exist
      # -----------------------------------------------------
      - name: Check Gurobi credentials
        shell: bash
        run: |
          test -n "$GRB_WLSACCESSID" || {
            echo "ERROR: GRB_WLSACCESSID is missing"
            exit 1
          }

          test -n "$GRB_WLSSECRET" || {
            echo "ERROR: GRB_WLSSECRET is missing"
            exit 1
          }

          test -n "$GRB_LICENSEID" || {
            echo "ERROR: GRB_LICENSEID is missing"
            exit 1
          }

          echo "Gurobi WLS credentials are configured."

      # -----------------------------------------------------
      # Verify Gurobi installation
      # -----------------------------------------------------
      - name: Check Gurobi installation
        run: |
          python - <<'PY'
          import gurobipy as gp

          print("Gurobi version:", gp.gurobi.version())
          PY

      # -----------------------------------------------------
      # Basic WLS connection test
      # -----------------------------------------------------
      - name: Test Gurobi WLS
        run: |
          python - <<'PY'
          import os
          import gurobipy as gp

          env = gp.Env(
              params={
                  "WLSACCESSID": os.environ["GRB_WLSACCESSID"],
                  "WLSSECRET": os.environ["GRB_WLSSECRET"],
                  "LICENSEID": int(os.environ["GRB_LICENSEID"]),
              }
          )

          env.start()

          print("Gurobi WLS connection successful.")

          env.close()
          PY

      # -----------------------------------------------------
      # Run all tests
      # -----------------------------------------------------
      - name: Run tests
        run: |
          pytest -v