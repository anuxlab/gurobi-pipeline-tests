name: Gurobi CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gurobi-tests:
    name: ${{ matrix.suite }}${{ matrix.instance && format(' / {0}', matrix.instance) || '' }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - suite: gurobi
            test_path: tests/test_gurobi.py
            instance: ""
          - suite: lp
            test_path: tests/test_lp.py
            instance: ""
          - suite: mip
            test_path: tests/test_mip.py
            instance: ""
          - suite: qp
            test_path: tests/test_qp.py
            instance: ""
          - suite: advanced
            test_path: tests/test_advanced.py
            instance: ""
          - suite: evrp
            test_path: tests/test_evrp.py
            instance: TS1.json
          - suite: evrp
            test_path: tests/test_evrp.py
            instance: TS2.json
          - suite: evrp
            test_path: tests/test_evrp.py
            instance: TS3.json
          - suite: evrp
            test_path: tests/test_evrp.py
            instance: TS4.json
          - suite: evrp
            test_path: tests/test_evrp.py
            instance: TS5.json
          - suite: evrp
            test_path: tests/test_evrp.py
            instance: TS6.json

    env:
      GRB_WLSACCESSID: ${{ secrets.GRB_WLSACCESSID }}
      GRB_WLSSECRET: ${{ secrets.GRB_WLSSECRET }}
      GRB_LICENSEID: ${{ secrets.GRB_LICENSEID }}
      GUROBI_CONFIG: config/development.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate WLS configuration
        run: |
          python - <<'PY'
          import os
          required = ["GRB_WLSACCESSID", "GRB_WLSSECRET", "GRB_LICENSEID"]
          missing = [x for x in required if not os.getenv(x)]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          if not os.getenv("GRB_LICENSEID").isdigit():
              raise SystemExit("GRB_LICENSEID must contain an integer")
          print("WLS environment variables are present.")
          PY

      - name: Run test
        env:
          EVRP_INSTANCE: ${{ matrix.instance }}
        run: pytest -v ${{ matrix.test_path }}
