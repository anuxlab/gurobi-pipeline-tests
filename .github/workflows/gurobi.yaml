name: Gurobi CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install PyYAML==6.0.3
      - name: Validate files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, yaml
          for p in [Path("config/development.yaml"), Path("config/research.yaml")]:
              yaml.safe_load(p.read_text())
          names=["tiny_evrp.json"]+[f"TS{i}.json" for i in range(1,7)]
          for n in names:
              d=json.loads((Path("instances")/n).read_text())
              assert d["depot"] in d["nodes"]
              assert all(c in d["nodes"] for c in d["customers"])
          print("Static validation OK")
          PY

  solver:
    name: ${{ matrix.name }}
    needs: static
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Smoke
            path: tests/test_gurobi.py
          - name: LP
            path: tests/test_lp.py
          - name: MIP
            path: tests/test_mip.py
          - name: QP
            path: tests/test_qp.py
          - name: Advanced
            path: tests/test_advanced.py
    env:
      GRB_WLSACCESSID: ${{ secrets.GRB_WLSACCESSID }}
      GRB_WLSSECRET: ${{ secrets.GRB_WLSSECRET }}
      GRB_LICENSEID: ${{ secrets.GRB_LICENSEID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate WLS secrets
        shell: bash
        run: |
          set -e
          test -n "$GRB_WLSACCESSID"
          test -n "$GRB_WLSSECRET"
          [[ "$GRB_LICENSEID" =~ ^[0-9]+$ ]]
      - name: Run pytest
        run: |
          mkdir -p reports
          python -m pytest "${{ matrix.path }}" -v --junitxml=reports/results.xml
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.name }}
          path: reports/results.xml
          if-no-files-found: ignore

  evrp:
    name: EVRP / ${{ matrix.instance }}
    needs: static
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        instance: [tiny_evrp.json, TS1.json, TS2.json, TS3.json, TS4.json, TS5.json, TS6.json]
    env:
      GRB_WLSACCESSID: ${{ secrets.GRB_WLSACCESSID }}
      GRB_WLSSECRET: ${{ secrets.GRB_WLSSECRET }}
      GRB_LICENSEID: ${{ secrets.GRB_LICENSEID }}
      EVRP_INSTANCE: ${{ matrix.instance }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate WLS secrets
        shell: bash
        run: |
          set -e
          test -n "$GRB_WLSACCESSID"
          test -n "$GRB_WLSSECRET"
          [[ "$GRB_LICENSEID" =~ ^[0-9]+$ ]]
      - name: Run EVRP tests
        run: |
          mkdir -p reports
          python -m pytest tests/test_evrp.py -v --junitxml=reports/results.xml
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-evrp-${{ matrix.instance }}
          path: reports/results.xml
          if-no-files-found: ignore
