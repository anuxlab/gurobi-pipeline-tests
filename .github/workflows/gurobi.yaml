name: Gurobi CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping workflow runs from consuming WLS sessions.
# WLS tokens can remain counted until their token lifespan expires.
concurrency:
  group: gurobi-wls-${{ github.repository }}
  cancel-in-progress: false

jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install static dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Validate YAML and JSON files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import yaml

          for path in Path("config").glob("*.yaml"):
              yaml.safe_load(path.read_text())

          required = [
              Path("instances/tiny_evrp.json"),
              *[Path(f"instances/TS{i}.json") for i in range(1, 7)],
          ]

          for path in required:
              data = json.loads(path.read_text())
              assert data["depot"] in data["nodes"], path
              assert data["customers"], path
              assert all(c in data["nodes"] for c in data["customers"]), path

          print("Static validation passed.")
          PY

  gurobi-tests:
    name: Gurobi test matrix
    needs: static-validation
    # Fork PRs do not receive repository secrets. They still get static validation.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false

    env:
      GRB_WLSACCESSID: ${{ secrets.GRB_WLSACCESSID }}
      GRB_WLSSECRET: ${{ secrets.GRB_WLSSECRET }}
      GRB_LICENSEID: ${{ secrets.GRB_LICENSEID }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate WLS secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GRB_WLSACCESSID}"
          test -n "${GRB_WLSSECRET}"
          [[ "${GRB_LICENSEID}" =~ ^[0-9]+$ ]]
          echo "WLS credentials are configured."

      - name: Run complete test matrix
        run: |
          mkdir -p reports
          python -m pytest -v --junitxml=reports/junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gurobi-junit-report
          path: reports/junit.xml
          if-no-files-found: error
