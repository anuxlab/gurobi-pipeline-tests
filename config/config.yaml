# ============================================================
# Project Configuration
# ============================================================

project:
  name: gurobi-pipeline-tests
  version: "1.0"

# ============================================================
# Gurobi Configuration
# ============================================================

gurobi:
  version: "13.0.3"

  # WLS configuration
  license:
    type: wls
    license_id: 2871490

    # NEVER put WLSACCESSID or WLSSECRET here.
    # They are supplied through environment variables.
    access_id_env: GRB_WLSACCESSID
    secret_env: GRB_WLSSECRET
    license_id_env: GRB_LICENSEID

  parameters:
    OutputFlag: 1
    LogToConsole: 1

    # General optimization settings
    TimeLimit: 300
    MIPGap: 0.001

    # Reproducibility
    Seed: 42

# ============================================================
# Python Configuration
# ============================================================

python:
  version: "3.13"

# ============================================================
# Directory Configuration
# ============================================================

paths:
  source: src
  tests: tests
  instances: instances
  results: results
  logs: logs
  models: models
  plots: plots
  data: data

# ============================================================
# Test Configuration
# ============================================================

tests:
  run_license: true
  run_version: true
  run_lp: true
  run_binary_mip: true
  run_integer_mip: true
  run_infeasible: true
  run_time_limit: true
  run_evrp: true

  fail_fast: true

# ============================================================
# EVRP Configuration
# ============================================================

evrp:
  instance_directory: instances

  default_instance: tiny_evrp.json

  vehicle:
    capacity: 100
    battery_capacity: 40.0
    initial_battery: 40.0
    energy_rate: 0.159
    speed: 100.0
    charge_rate: 24.0

  charging:
    enabled: true

  pricing:
    fixed_revenue: 20.0
    base_price: 0.25
    peak_price: 0.45

# ============================================================
# Research Experiments
# ============================================================

experiments:
  enabled: false

  instances:
    - TS1
    - TS2
    - TS3
    - TS4
    - TS5
    - TS6

  algorithms:
    - LLP
    - NIP
    - BPC
    - ALNS

  repetitions: 1

# ============================================================
# CI Configuration
# ============================================================

ci:
  enabled: true

  operating_system: ubuntu-latest

  python_versions:
    - "3.13"

  run_on:
    - push
    - pull_request